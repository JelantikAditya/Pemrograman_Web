<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center mt-5">
        <button type="submit" class="btn btn-primary p-4 m-3 "  onclick="loadDoc()">Klik gw Bang!</button>
        <div  class="text-center bg-secondary text-white rounded m-6 ">
            <p id="demo"></p>
        </div>
    </div>
    

    <script>
        function loadDoc(){
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function() {
                myFunction(this);
            };
            xhttp.open("GET", "cd_catalog.xml");
            xhttp.send();
        }

        function myFunction(xml) {
            const xmlDoc = xml.responseXML;
            const x = xmlDoc.getElementsByTagName("cd");
            let data = "";
            for (let i = 0; i < x.length; i++) {
                data += x[i].getElementsByTagName("title")[0].childNodes[0].nodeValue + "<br>";
            }
            document.getElementById("demo").innerHTML = data;
        }


    </script>
</body>
</html>
