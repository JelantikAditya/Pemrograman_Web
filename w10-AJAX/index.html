<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD Catalog AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
    <div class="container text-center mt-5">
        <button type="submit" class="btn btn-primary p-4 m-3" onclick="loadDoc()">Klik gw Bang!</button>

        <div class="bg-secondary text-white rounded p-4 mb-5">
            <div id="demo"></div>
        </div>
    </div>
    <script>
        function loadDoc(){
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function() {
                loadTable(this);
            };
            xhttp.open("GET", "cd_catalog.xml");
            xhttp.send();
        }
        function loadTable(xml) {
            const xmlDoc = xml.responseXML;
            const cds = xmlDoc.getElementsByTagName("cd");

            let table = `
            <table class="table table-striped table-bordered table-dark mt-3">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Artist</th>
                        <th>Type</th>
                        <th>Release</th>
                    </tr>
                </thead>
                <tbody>
            `;

            for (let i = 0; i < cds.length; i++) {
                let title = cds[i].getElementsByTagName("title")[0].childNodes[0].nodeValue;
                let artist = cds[i].getElementsByTagName("artist")[0].childNodes[0].nodeValue;
                let type = cds[i].getElementsByTagName("type")[0].childNodes[0].nodeValue;
                let release = cds[i].getElementsByTagName("release")[0].childNodes[0].nodeValue;

                table += `
                    <tr>
                        <td>${title}</td>
                        <td>${artist}</td>
                        <td>${type}</td>
                        <td>${release}</td>
                    </tr>
                `;
            }

            table += `
                </tbody>
            </table>
            `;

            document.getElementById("demo").innerHTML = table;
        }
    </script>
</body>
</html>
